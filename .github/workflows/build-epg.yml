name: Build minimal Israeli EPG
on:
  workflow_dispatch:
  schedule:
    - cron: '21 */6 * * *'
  push:
    paths:
      - 'scripts/build_epg.py'
      - '.github/workflows/build-epg.yml'

permissions:
  contents: write

concurrency:
  group: israel-live-tv-epg
  cancel-in-progress: false

jobs:
  update-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch verified XMLTV programme listings
        run: python scripts/build_epg.py
      - name: Commit generated guide only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg/idan-plus.xml epg/status.json
          if git diff --cached --quiet; then
            echo "No EPG changes."
          else
            git commit -m "Refresh verified Israeli TV programme guide"
            git push
          fi
